name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }} · py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      # Actions pinned by commit SHA (audit M9); the comment records the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        # Install the anthropic extra too, so the hosted adapter is importable
        # and covered in CI (audit L8).
        run: python -m pip install --upgrade pip && pip install -e ".[dev,anthropic]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy src

      - name: Test (with coverage floor)
        run: pytest -q

  lockfile:
    name: locked install (uv --frozen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Sync from the lockfile (fails if uv.lock is stale)
        run: uv sync --all-extras --frozen

      - name: Test against the locked environment
        run: uv run pytest -q

  security:
    name: supply-chain (SCA)
    runs-on: ubuntu-latest
    # Advisory, like the rest of the project's audit posture: it surfaces known
    # vulnerabilities without blocking an unrelated change (audit M9).
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install project + pip-audit
        run: python -m pip install --upgrade pip && pip install -e ".[anthropic]" pip-audit

      - name: Audit dependencies (pip-audit)
        run: pip-audit --strict
