name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }} · py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      # Actions pinned by commit SHA (audit M9); the comment records the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        # Install the anthropic extra too, so the hosted adapter is importable
        # and covered in CI (audit L8).
        run: python -m pip install --upgrade pip && pip install -e ".[dev,anthropic]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        # Scope to Python source only: ruff's handling of code blocks embedded in
        # Markdown varies across ruff versions, which would make this check flap
        # on a formatter bump unrelated to our code (audit L8).
        run: ruff format --check src tests scripts

      - name: Type check (mypy)
        run: mypy src

      - name: Test (with coverage floor)
        run: pytest -q

  lockfile:
    name: locked install (uv --frozen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Sync from the lockfile (fails if uv.lock is stale)
        run: uv sync --all-extras --frozen

      - name: Test against the locked environment
        run: uv run pytest -q

  security:
    name: supply-chain (SCA)
    runs-on: ubuntu-latest
    # Advisory, like the rest of the project's audit posture: it surfaces known
    # vulnerabilities without blocking an unrelated change (audit M9).
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install project + pip-audit
        run: python -m pip install --upgrade pip && pip install -e ".[anthropic]" pip-audit

      - name: Audit dependencies (pip-audit)
        # --skip-editable skips this project's own local install (not on PyPI);
        # a real vulnerability in a third-party dependency still fails the step.
        run: pip-audit --skip-editable

  emulator-smoke:
    name: emulator smoke (real adb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e .

      - name: Enable KVM (required by the Android emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test against a booted emulator (real adb I/O)
        # Boots an Android emulator, then runs the read-only smoke: it proves the
        # bridge -> parse -> allowlist read path works against a real device,
        # which the fake-bridge unit tests cannot cover.
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          script: python scripts/emulator_smoke.py

  container-runner:
    name: container runner (build · scan · smoke)
    runs-on: ubuntu-latest
    # Informational, not a required check (like the emulator smoke): it builds a
    # container image and exercises the ContainerRunner sandbox path, so a quirk
    # of the hosted runner's Docker/USB setup must not gate an unrelated merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e .

      - name: Build the adb-tools sandbox image
        run: docker build -t android-agent/adb-tools:latest -f docker/adb-tools.Dockerfile .

      - name: Scan the image (Trivy)
        # Fails the step only on an unfixed CRITICAL; HIGH and below are printed
        # for visibility. The job is advisory, so even that does not gate merges.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: android-agent/adb-tools:latest
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true

      - name: Image runs the hardened toolchain (adb present, no network)
        # The deterministic proof: the built image actually runs `adb` under the
        # exact hardening flags ContainerRunner applies (no network, no new
        # privileges, all caps dropped, read-only root + tmpfs).
        run: |
          docker run --rm --network none \
            --security-opt=no-new-privileges --cap-drop=ALL \
            --read-only --tmpfs=/tmp -e HOME=/tmp \
            android-agent/adb-tools:latest adb version

      - name: Drive the ContainerRunner path end-to-end (assert, don't assume)
        # Exercise the REAL ContainerRunner.execute path and assert on concrete
        # behaviour: the docker run must succeed (returncode 0) and adb's own
        # banner must come back through the sandbox. `android-agent devices`
        # alone can't tell "ran cleanly, no phone" from "docker failed" (both
        # print nothing and exit 0), so this would otherwise pass vacuously
        # (audit M10 / adversarial review).
        run: |
          # ContainerRunner passes --device=/dev/bus/usb on Linux; ensure the
          # path exists on the hosted runner so `docker run` accepts it.
          [ -e /dev/bus/usb ] || sudo mkdir -p /dev/bus/usb
          python - <<'PY'
          import sys
          from android_agent.bridge.device import Bridge
          from android_agent.bridge.sandbox import ContainerRunner

          # Force docker: the image was built into docker's daemon above, and the
          # runner also has podman (which engine() would otherwise prefer and
          # which can't see a docker-built image).
          out = Bridge(ContainerRunner(engine="docker")).execute(["adb", "devices"])
          print(f"rc={out.returncode}\nstdout={out.stdout!r}\nstderr={out.stderr!r}")
          if not out.ok:
              sys.exit(f"FAIL: ContainerRunner adb exited {out.returncode}: {out.stderr}")
          if "List of devices attached" not in out.stdout:
              sys.exit("FAIL: adb banner not returned from inside the sandbox")
          print("OK: ContainerRunner ran adb inside the sandbox and returned its output")
          PY

      - name: Generate and upload the SBOM (CycloneDX)
        # Ship the dependency inventory as a build artifact so "are we affected
        # by CVE-X?" is answerable later (audit M11).
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: warn
