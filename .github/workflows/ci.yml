name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }} · py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      # Actions pinned by commit SHA (audit M9); the comment records the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        # Install the anthropic extra too, so the hosted adapter is importable
        # and covered in CI (audit L8).
        run: python -m pip install --upgrade pip && pip install -e ".[dev,anthropic]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy src

      - name: Test (with coverage floor)
        run: pytest -q

  lockfile:
    name: locked install (uv --frozen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Sync from the lockfile (fails if uv.lock is stale)
        run: uv sync --all-extras --frozen

      - name: Test against the locked environment
        run: uv run pytest -q

  security:
    name: supply-chain (SCA)
    runs-on: ubuntu-latest
    # Advisory, like the rest of the project's audit posture: it surfaces known
    # vulnerabilities without blocking an unrelated change (audit M9).
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install project + pip-audit
        run: python -m pip install --upgrade pip && pip install -e ".[anthropic]" pip-audit

      - name: Audit dependencies (pip-audit)
        # --skip-editable skips this project's own local install (not on PyPI);
        # a real vulnerability in a third-party dependency still fails the step.
        run: pip-audit --skip-editable

  emulator-smoke:
    name: emulator smoke (real adb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e .

      - name: Enable KVM (required by the Android emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test against a booted emulator (real adb I/O)
        # Boots an Android emulator, then runs the read-only smoke: it proves the
        # bridge -> parse -> allowlist read path works against a real device,
        # which the fake-bridge unit tests cannot cover.
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          script: python scripts/emulator_smoke.py
