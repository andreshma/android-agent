name: Release

# Build the distributions and publish them to PyPI when a version tag is pushed.
# Publishing uses PyPI Trusted Publishing (OIDC): there is NO API token stored
# in the repository. The one-time PyPI setup is documented in RELEASING.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  pypi-publish:
    name: Build & publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/android-agent
    permissions:
      id-token: write # OIDC token for Trusted Publishing (the only privilege needed)
    steps:
      # Actions pinned by commit SHA (audit M9); the comment records the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check the built distributions
        run: |
          python -m pip install --upgrade twine
          twine check dist/*

      - name: Publish to PyPI (Trusted Publishing — no token)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
