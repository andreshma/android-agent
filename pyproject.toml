[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "android-agent"
version = "0.1.2"
description = "An LLM-driven agent that helps you audit, optimize, flash and unlock YOUR OWN Android device — in a sandbox, with human-readable explanations and confirmation before every action."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "android-agent contributors" }]
keywords = ["android", "adb", "fastboot", "llm", "ollama", "audit", "optimization", "agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Topic :: System :: Hardware",
]

dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.6",
  "httpx>=0.27",
  "platformdirs>=4.2",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.39"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10", "hypothesis>=6.0"]

[project.scripts]
android-agent = "android_agent.cli:app"

[project.urls]
Homepage = "https://github.com/andreshma/android-agent"
Issues = "https://github.com/andreshma/android-agent/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/android_agent"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = [
  "S603", "S607",  # argv is validated by the allowlist before exec
  "B008",          # typer.Argument/Option in defaults is the idiomatic Typer pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # asserts are fine in tests

[tool.mypy]
python_version = "3.10"
packages = ["android_agent"]
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=android_agent --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["android_agent"]
omit = ["*/__main__.py"]  # thin `python -m` entry shim

[tool.coverage.report]
# Security-relevant code should stay well tested; this floor fails CI if
# coverage regresses below it (audit M8).
fail_under = 80
show_missing = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@abstractmethod",
  "pragma: no cover",
]
