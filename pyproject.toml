[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "android-agent"
version = "0.1.0"
description = "An LLM-driven agent that helps you audit, optimize, flash and unlock YOUR OWN Android device — in a sandbox, with human-readable explanations and confirmation before every action."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "android-agent contributors" }]
keywords = ["android", "adb", "fastboot", "llm", "ollama", "audit", "optimization", "agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Topic :: System :: Hardware",
]

dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.6",
  "httpx>=0.27",
  "platformdirs>=4.2",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.39"]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
android-agent = "android_agent.cli:app"

[project.urls]
Homepage = "https://github.com/your-org/android-agent"
Issues = "https://github.com/your-org/android-agent/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/android_agent"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
